name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.3)'
        required: true

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Regenerate Formula/tin.rb
        run: |
          set -eu
          [ -n "${VERSION:-}" ] || { echo "no release tag provided" >&2; exit 1; }
          sh packaging/update-formula.sh "$VERSION" Formula/tin.rb

      - name: Commit and push if changed
        run: |
          set -eu
          if git diff --quiet -- Formula/tin.rb; then
            echo "Formula already current for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tin.rb
          git commit -m "Update Homebrew formula to $VERSION"
          git push origin "HEAD:$BRANCH"
