name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve version to commit
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          git fetch --force --tags origin
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag not found: $VERSION" >&2
            exit 1
          fi
          REVISION="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          TAG_TYPE="$(git cat-file -t "refs/tags/$VERSION")"
          if [ "$TAG_TYPE" != "tag" ] && [ "$TAG_TYPE" != "commit" ]; then
            echo "tag $VERSION does not point at a commit" >&2
            exit 1
          fi
          if ! printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "tag $VERSION did not resolve to a full commit" >&2
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION ($TAG_TYPE) -> $REVISION"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
            artifact: tin-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-linux-gnu
            artifact: tin-linux-aarch64
          - runner: macos-15
            target: aarch64-macos
            artifact: tin-darwin-aarch64
          - runner: macos-15-intel
            target: x86_64-macos
            artifact: tin-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        working-directory: engine
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package
        run: sh packaging/package.sh engine/zig-out/bin/tin "${{ matrix.artifact }}" dist "${{ needs.resolve.outputs.revision }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  gate:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: tin-linux-x86_64
            execute: "1"
          - runner: ubuntu-latest
            artifact: tin-linux-aarch64
            execute: "0"
          - runner: macos-15
            artifact: tin-darwin-aarch64
            execute: "1"
          - runner: macos-15-intel
            artifact: tin-darwin-x86_64
            execute: "1"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: candidate

      - name: Verify candidate package
        env:
          TIN_EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
          TIN_SMOKE_EXECUTE: ${{ matrix.execute }}
          TIN_PACKAGE_SMOKE_INSTALLER: ${{ github.workspace }}/install.sh
        run: |
          sh engine/tests/package_smoke.sh \
            "candidate/${{ matrix.artifact }}.tar.gz" \
            "candidate/${{ matrix.artifact }}.tar.gz.sha256"

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Verify checksums
        run: |
          set -eu
          cd dist
          for archive in *.tar.gz; do
            sha256sum -c "$archive.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: false
          body: 'Release ${{ github.event.inputs.version || github.ref_name }}'
          make_latest: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Regenerate Formula/tin.rb
        run: |
          set -eu
          [ -n "${VERSION:-}" ] || { echo "no release tag provided" >&2; exit 1; }
          sh packaging/update-formula.sh "$VERSION" Formula/tin.rb

      - name: Commit and push if changed
        run: |
          set -eu
          if git diff --quiet -- Formula/tin.rb; then
            echo "Formula already current for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tin.rb
          git commit -m "Update Homebrew formula to $VERSION"
          git push origin "HEAD:$BRANCH"
