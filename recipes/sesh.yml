name: sesh
description: Install sesh fuzzy tmux session selector

steps:
  - name: Install sesh
    install: sesh

  - name: Install zoxide
    install: zoxide

  - name: Swap tmux-sessionx for sesh in tmux config
    run: |
      CONF=~/.tmux.conf
      [ -L "$CONF" ] && CONF=$(readlink "$CONF")
      sed -i '' -e '/sessionx/d' "$CONF"
      grep -q "sesh picker" "$CONF" || printf '\n# sesh: fuzzy session selector (prefix L)\nbind-key -T prefix L display-popup -E "sesh picker"\n' >> "$CONF"
      rm -rf ~/.tmux/plugins/tmux-sessionx
      tmux source-file ~/.tmux.conf >/dev/null 2>&1 || true