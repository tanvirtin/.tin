
identity:
  name: Your Name
  email: you@example.com

symlinks:
  shell:
    - source: assets/.zshrc
      target: ~/.zshrc

    - source: assets/.tmux.conf
      target: ~/.tmux.conf

  editor:
    - source: nvim
      target: ~/.config/nvim

  terminal:
    - source: assets/alacritty.toml
      target: ~/.config/alacritty/alacritty.toml

    - source: assets/ghostty/config
      target: ~/.config/ghostty/config

fonts: assets/fonts

exports:
  opencode:
    dir: ~/.config/opencode/skills

runtimes:
  cursor:
    mcp: ~/.cursor/mcp.json
    dialect: cursor

  claude:
    mcp: ~/.claude.json
    dialect: claude

  vscode:
    mcp: .vscode/mcp.json
    dialect: vscode

  codex:
    mcp: ~/.codex/config.toml
    dialect: codex

  zed:
    mcp: ~/.config/zed/settings.json
    dialect: zed

recipes:
  shell:
    - zsh
    - starship
    - zsh-autosuggestions

  editor:
    - neovim

  dev:
    - git
    - gh
    - rust

  infra:
    - ripgrep
    - tmux
    - curl

install:
  - link
  - fonts
  - recipes: shell
  - recipes: editor
  - recipes: dev
  - recipes: infra
