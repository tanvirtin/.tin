
identity:
  name: Your Name
  email: you@example.com

symlinks:
  shell:
    - source: assets/.zshrc
      target: ~/.zshrc

    - source: assets/.tmux.conf
      target: ~/.tmux.conf

  editor:
    - source: nvim
      target: ~/.config/nvim

  terminal:
    - source: assets/alacritty.toml
      target: ~/.config/alacritty/alacritty.toml

    - source: assets/ghostty/config
      target: ~/.config/ghostty/config

  ai:
    - source: assets/agent/AGENTS.md
      target: ~/.config/opencode/AGENTS.md

    - source: assets/opencode/agents/tin-coordinator.md
      target: ~/.config/opencode/agents/tin-coordinator.md

exports:
  opencode:
    dir: ~/.config/opencode/skills

fonts: assets/fonts

agents:
  - name: local
    url: http://127.0.0.1:4096

recipes:
  shell:
    - zsh
    - starship
    - zsh-autosuggestions

  editor:
    - neovim

  dev:
    - git
    - gh
    - rust

  infra:
    - ripgrep
    - tmux
    - curl

install:
  - link
  - fonts
  - recipes: shell
  - recipes: editor
  - recipes: dev
  - recipes: infra
