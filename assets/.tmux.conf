set-option -g prefix C-a
set-option -g mouse on
set-option -g focus-events on
set-option -g default-terminal screen-256color
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g status-style bg=#272822,fg=#f8f8f2
set-option -g status-left-length 40
set-option -g status-left "#[bg=#a6e22e,fg=#272822,bold]  #S #[bg=#272822,fg=#a6e22e]"
set-option -g status-right "#[fg=#75715e]#[bg=#75715e,fg=#f8f8f2]  %H:%M #[fg=#f4bf75]#[bg=#f4bf75,fg=#272822,bold]  %d-%b "
set-option -g window-status-format "#[fg=#75715e]  #I:#W "
set-option -g window-status-current-format "#[fg=#272822,bg=#66d9ef]#[fg=#272822,bg=#66d9ef,bold]  #I:#W #[fg=#66d9ef,bg=#272822]"
set-option -g window-status-separator ""
set-option -g pane-border-style fg=#75715e
set-option -g pane-active-border-style fg=#a6e22e
set-option -g message-style bg=#f4bf75,fg=#272822
unbind-key C-b
bind-key C-a send-prefix
bind-key -T prefix l last-window
bind-key -T prefix W choose-tree -w
set -g @plugin 'tmux-plugins/tpm'
set -ga terminal-overrides ",*256col*:Tc"
run '~/.tmux/plugins/tpm/tpm'

# sesh: fuzzy session selector (prefix L)
bind-key -T prefix L display-popup -E "sesh picker"
