# Personal tin configuration, created by `tin init`.
#
# This file lives at ~/.config/tin/tinrc.yml and takes precedence over the
# repo default at ~/.tin/tinrc.yml. Nothing here is applied until you run
# `tin install` or `tin link`.

identity:
  name: Your Name
  email: example@example.com

# Publish skills where your runtime reads them. Zed reads global skills from
# ~/.agents/skills.
exports:
  zed:
    dir: ~/.agents/skills
