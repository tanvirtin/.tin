name: zsh
description: Install zsh and set as default shell

steps:
  - name: Install zsh (macOS)
    install: zsh
    if: os == 'darwin'

  - name: Install zsh (Linux)
    install: zsh
    if: os == 'linux'

  - name: Set default shell
    run: |
      set -e
      if command -v dscl >/dev/null 2>&1; then
        CURRENT="$(dscl . -read "$HOME" UserShell 2>/dev/null | awk '{print $2}')"
      else
        CURRENT="$(getent passwd "$(id -un)" 2>/dev/null | cut -d: -f7)"
      fi
      DESIRED="$(command -v zsh)"
      if [ "$CURRENT" = "$DESIRED" ]; then
        echo "  login shell already $DESIRED"
        exit 0
      fi
      if [ "$(basename "$CURRENT")" = "zsh" ]; then
        echo "  login shell is $CURRENT; leaving it (switch with: chsh -s $DESIRED)"
        exit 0
      fi
      if ! grep -qxF "$DESIRED" /etc/shells 2>/dev/null; then
        printf '%s\n' "$DESIRED" | sudo tee -a /etc/shells >/dev/null
      fi
      chsh -s "$DESIRED"
