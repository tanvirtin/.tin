name: zsh
description: Install zsh and set as default shell

steps:
  - name: Install zsh (macOS)
    install: zsh
    if: os == 'darwin'

  - name: Install zsh (Linux)
    install: zsh
    if: os == 'linux'

  - name: Set default shell
    run: |
      SHELL_PATH="$(command -v zsh)"
      if ! grep -qxF "$SHELL_PATH" /etc/shells 2>/dev/null; then
        printf '%s\n' "$SHELL_PATH" | sudo tee -a /etc/shells >/dev/null
      fi
      chsh -s "$SHELL_PATH"
    if: "!exists('~/.zsh_configured')"

  - name: Mark zsh configured
    run: touch ~/.zsh_configured
    if: "!exists('~/.zsh_configured')"
